[project]
name = "study-rag"
version = "0.1.0"
description = "RAG study assistant over master's course materials — hybrid search, reranking, cited answers, evaluated in CI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pypdf>=4.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# Real embeddings + cross-encoder reranker (Hugging Face, runs on CPU)
local = ["sentence-transformers>=3.0"]
# Postgres + pgvector store
pg = ["psycopg[binary]>=3.1", "pgvector>=0.3"]
# Claude via the Claude API (ANTHROPIC_API_KEY) or Amazon Bedrock
claude = ["anthropic[bedrock]>=0.70"]
# HTTP API (local uvicorn, or Lambda via Lambda Web Adapter)
api = ["fastapi>=0.110", "uvicorn>=0.29"]
# S3 index download in Lambda
aws = ["boto3>=1.34"]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27", "fastapi>=0.110"]

[project.scripts]
study-rag = "study_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/study_rag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
