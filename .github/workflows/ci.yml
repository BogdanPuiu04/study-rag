name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv && uv pip install -e ".[dev]"
      - run: .venv/bin/ruff check .
      - run: .venv/bin/pytest -q

  retrieval-eval:
    # Quality gate: a change that hurts retrieval fails the PR, like a failing test.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv && uv pip install -e ".[dev]"
      - run: .venv/bin/study-rag ingest data/sample
      - name: Evaluate
        run: |
          .venv/bin/study-rag eval eval/golden.jsonl --min-recall 0.8 | tee eval.md
          cat eval.md >> "$GITHUB_STEP_SUMMARY"
