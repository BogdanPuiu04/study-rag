name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plumbing:
    # Infrastructure code: must always be green.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen ruff check .
      - run: uv run --frozen pytest -q tests/test_plumbing.py tests/test_production.py tests/test_quiz.py tests/test_baseline.py

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra dev --extra aws
      - run: uv run --frozen mypy

  core:
    # The core RAG components.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen pytest -q

  retrieval-eval:
    # Quality gate: a change that hurts retrieval fails the PR, like a failing test.
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen study-rag ingest data/sample
      - name: Evaluate
        # eval/baseline.json is the last accepted report (make baseline). Once it exists,
        # a PR that makes hybrid retrieval worse fails even while above the 0.8 floor.
        run: |
          ARGS="--min-recall 0.8"
          if [ -f eval/baseline.json ]; then ARGS="$ARGS --baseline eval/baseline.json"; fi
          uv run --frozen study-rag eval eval/golden.jsonl $ARGS | tee eval.md
          cat eval.md >> "$GITHUB_STEP_SUMMARY"

  lockfile:
    # pyproject.toml changed but uv.lock wasn't regenerated -> fail.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv lock --check

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: [infra/terraform, infra/bootstrap]
    defaults:
      run:
        working-directory: ${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.10.5"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false && terraform validate
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --config "$GITHUB_WORKSPACE/.tflint.hcl"

  terraform-scan:
    # Informational for now: triage the first findings (some are deliberate, e.g. SSE-S3
    # instead of a KMS key to keep the idle cost at zero), record each exception in
    # .trivyignore with a reason, then drop `exit-code: "0"` to make it blocking.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL
          exit-code: "0"
