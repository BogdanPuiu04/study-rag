name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plumbing:
    # Infrastructure code: must always be green.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen ruff check .
      - run: uv run --frozen pytest -q tests/test_plumbing.py tests/test_production.py

  core:
    # The hand-written RAG components (see docs/EXERCISES.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen pytest -q

  retrieval-eval:
    # Quality gate: a change that hurts retrieval fails the PR, like a failing test.
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen study-rag ingest data/sample
      - name: Evaluate
        run: |
          uv run --frozen study-rag eval eval/golden.jsonl --min-recall 0.8 | tee eval.md
          cat eval.md >> "$GITHUB_STEP_SUMMARY"

  lockfile:
    # pyproject.toml changed but uv.lock wasn't regenerated -> fail.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv lock --check

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: [infra/terraform, infra/bootstrap]
    defaults:
      run:
        working-directory: ${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false && terraform validate
