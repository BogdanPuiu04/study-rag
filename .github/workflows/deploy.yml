name: deploy

# Manual only: every deploy is a deliberate action (and AWS costs are yours).
# Ships code only. Data flows separately: upload docs to S3 -> Lambda reindexes.
on:
  workflow_dispatch:

permissions:
  id-token: write # OIDC token for AWS
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/study-rag:${GITHUB_SHA::12}"
          docker buildx build --provenance=false --platform linux/amd64 \
            --cache-from type=gha --cache-to type=gha,mode=max \
            -t "$IMAGE" --push .
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Roll Lambda to the new image
        run: |
          aws lambda update-function-code --function-name study-rag \
            --image-uri "${{ steps.image.outputs.uri }}" >/dev/null
          aws lambda wait function-updated --function-name study-rag
          echo "Deployed ${{ steps.image.outputs.uri }}" >> "$GITHUB_STEP_SUMMARY"
