# Install once: uv run pre-commit install   (add pre-commit to your tools: uv tool install pre-commit)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      # Local hooks use the project's own pinned tool versions (uv.lock), so a hook can't
      # disagree with CI about what passes.
      - id: ruff
        name: ruff
        entry: uv run --frozen ruff check
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run --frozen mypy
        language: system
        types: [python]
        pass_filenames: false
